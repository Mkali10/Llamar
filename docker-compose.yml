services:
  api:
    build: ./backend
    env_file: .env
    environment:
      PORT: 18443
    ports: ["${LLAMAR_API_BIND_IP:-127.0.0.1}:${LLAMAR_API_PORT:-18443}:18443"]
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes: ["report_exports:/var/lib/llamar/exports", "recordings:/var/lib/llamar/recordings"]
  campaign-worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  knowledge-worker:
    build: ./backend
    command: ["node", "dist/knowledgeWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  notification-worker:
    build: ./backend
    command: ["node", "dist/notificationWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  report-worker:
    build: ./backend
    command: ["node", "dist/reportWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: ["report_exports:/var/lib/llamar/exports"]
    restart: unless-stopped
  recording-retention-worker:
    build: ./backend
    command: ["node", "dist/recordingRetentionWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: ["recordings:/var/lib/llamar/recordings"]
    restart: unless-stopped
  voice-gateway:
    build: ./backend
    command: ["node", "dist/voiceGateway.js"]
    env_file: .env
    environment:
      VOICE_GATEWAY_PORT: 18090
    ports: ["${VOICE_GATEWAY_BIND_IP:-127.0.0.1}:${VOICE_GATEWAY_PORT:-18090}:18090"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  postgres:
    image: postgres:18.6-alpine
    command: ["postgres", "-p", "15432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 15432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # PostgreSQL 18+ stores versioned clusters below /var/lib/postgresql.
    # Mount the parent directory so pg_upgrade-compatible layouts are preserved.
    volumes: ["postgres_data:/var/lib/postgresql"]
  coturn:
    image: coturn/coturn:4.17.2-r0
    command:
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --server-name=${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=${TURN_PORT:-13478}
      - --min-port=${TURN_RELAY_MIN:-49160}
      - --max-port=${TURN_RELAY_MAX:-49260}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=1200
    ports:
      - "${TURN_PORT:-13478}:${TURN_PORT:-13478}/udp"
      - "${TURN_PORT:-13478}:${TURN_PORT:-13478}/tcp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49260}:${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49260}/udp"
    restart: unless-stopped
  migrate:
    image: postgres:18.6-alpine
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
  bootstrap:
    image: postgres:18.6-alpine
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
  web:
    build: ./web
    ports: ["${LLAMAR_WEB_BIND_IP:-0.0.0.0}:${LLAMAR_WEB_PORT:-18080}:18080"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  report_exports:
  recordings:
