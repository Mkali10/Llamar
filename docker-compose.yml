services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes: ["report_exports:/var/lib/llamar/exports"]
  campaign-worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  knowledge-worker:
    build: ./backend
    command: ["node", "dist/knowledgeWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  notification-worker:
    build: ./backend
    command: ["node", "dist/notificationWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  report-worker:
    build: ./backend
    command: ["node", "dist/reportWorker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: ["report_exports:/var/lib/llamar/exports"]
    restart: unless-stopped
  voice-gateway:
    build: ./backend
    command: ["node", "dist/voiceGateway.js"]
    env_file: .env
    ports: ["8090:8090"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  migrate:
    image: postgres:16-alpine
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
  bootstrap:
    image: postgres:16-alpine
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
  web:
    build: ./web
    ports: ["3000:80"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  report_exports:
